config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = ["eslint", "prettier", "@eslint/js", "@typescript-eslint/eslint-plugin", "@typescript-eslint/parser", "eslint-plugin-astro", "globals"]

[[plugin]]
name = "hadolint"

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier"]

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "osv-scanner"

# Baseline: existing production deploy workflow; hardening tracked separately.
[[exclude]]
plugins = ["zizmor", "actionlint"]
file_patterns = [".github/workflows/deploy.yml"]

# YAML formatting is enforced by `prettier --check` in Build and Tests using .prettierrc,
# whose yml override (double quotes) Qlty's bundled prettier does not apply.
[[exclude]]
plugins = ["prettier"]
file_patterns = ["**/*.yml", "**/*.yaml"]
